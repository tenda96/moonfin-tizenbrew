name: Update Moonfin TizenBrew app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-moonfin.yml"
      - "scripts/patch-moonfin-bundle.mjs"
      - "scripts/verify-tizenbrew-module.mjs"
      - "tizen-adapter.js"
      - "tizenbrew-diagnostics.js"
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Download latest Moonfin Tizen Regular WGT
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e

          API_URL="https://api.github.com/repos/Moonfin-Client/Smart-TV/releases/latest"

          rm -rf app tmp
          mkdir -p app tmp

          curl --fail --show-error --silent \
            --retry 4 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL" \
            -o tmp/release.json

          jq -e '.tag_name and (.assets | type == "array")' tmp/release.json > /dev/null
          ASSET_URL="$(jq -r '.assets[] | select(.name | test("Moonfin_Tizen_Regular_.*\\.wgt$")) | .browser_download_url' tmp/release.json | head -n 1)"
          VERSION="$(jq -r '.tag_name // empty' tmp/release.json)"

          if [ -z "$VERSION" ] || [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "No Moonfin Tizen Regular WGT asset found"
            exit 1
          fi

          echo "Moonfin version: $VERSION"
          echo "Asset URL: $ASSET_URL"

          curl --fail --show-error --location \
            --retry 4 --retry-all-errors \
            "$ASSET_URL" \
            -o tmp/moonfin.wgt
          unzip -q tmp/moonfin.wgt -d app

          echo "$VERSION" > app/MOONFIN_VERSION.txt

      - name: Inject TizenBrew helpers
        run: |
          set -e

          if [ ! -f "app/index.html" ]; then
            echo "app/index.html not found after extracting WGT"
            find app -maxdepth 3 -type f | sort
            exit 1
          fi

          TIZENBREW_REVISION="14"

          cp tizen-adapter.js app/tizen-adapter.js
          sed -i -E '/<script src="\.\/tizen-adapter\.js(\?[^"]*)?"><\/script>/d' app/index.html
          sed -i -E '/<script src="\.\/tizenbrew-diagnostics\.js(\?[^"]*)?"><\/script>/d' app/index.html
          sed -i "s#<head>#<head>\n<script src=\"./tizen-adapter.js?v=tizenbrew-${TIZENBREW_REVISION}\"></script>#" app/index.html

      - name: Apply TizenBrew bundle patches
        run: |
          set -e
          node scripts/patch-moonfin-bundle.mjs

      - name: Update package version from Moonfin release
        run: |
          set -e

          BASE_VERSION="$(cat app/MOONFIN_VERSION.txt | sed 's/^v//')"
          TIZENBREW_REVISION="14"
          IFS='.' read -r MAJOR MINOR PATCH_REST <<< "$BASE_VERSION"
          PATCH="${PATCH_REST%%[^0-9]*}"
          MODULE_VERSION="${MAJOR}.${MINOR}.$((PATCH + TIZENBREW_REVISION))"

          jq --arg version "$MODULE_VERSION" '.version = $version | .appPath = "app/index.html"' package.json > package.tmp.json
          mv package.tmp.json package.json

      - name: Cleanup
        run: |
          rm -rf tmp

      - name: Verify TizenBrew module
        run: |
          set -e
          node scripts/verify-tizenbrew-module.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add app package.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Moonfin TizenBrew app"
            git push
          fi

      - name: Purge jsDelivr cache
        run: |
          set -e

          for ref in "gh/${GITHUB_REPOSITORY}" "gh/${GITHUB_REPOSITORY}@main"
          do
            for path in \
              package.json \
              app/index.html \
              app/main.js \
              app/tizen-adapter.js
            do
              curl -fsS "https://purge.jsdelivr.net/${ref}/${path}"
            done
          done
